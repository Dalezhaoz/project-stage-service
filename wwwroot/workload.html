<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工时统计</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --line: #e2e5ed;
      --text: #1a1d26;
      --muted: #6e7687;
      --primary: #3b5bdb;
      --primary-hover: #2b4acb;
      --primary-light: #edf2ff;
      --primary-border: #bac8ff;
      --danger: #e03131;
      --success: #099268;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.03);
      --radius-lg: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 1440px; margin: 0 auto; padding: 20px 24px 40px; }
    .page-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      margin-bottom: 16px;
      padding: 18px 20px;
      border: 1px solid #dbe3f5;
      border-radius: 18px;
      background:
        radial-gradient(circle at top right, rgba(59, 91, 219, .1), transparent 36%),
        linear-gradient(180deg, #fff 0%, #fbfcff 100%);
      box-shadow: var(--shadow);
    }
    .header-kicker {
      display: inline-flex;
      width: fit-content;
      min-height: 28px;
      align-items: center;
      padding: 0 12px;
      border: 1px solid var(--primary-border);
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
    }
    h1 {
      margin-top: 10px;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.04em;
    }
    .subtitle {
      max-width: 780px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      align-content: start;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: .18s ease;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 18px rgba(59,91,219,.18); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #fff; color: #34405a; border: 1px solid #d8dfeb; box-shadow: none; }
    .btn-secondary:hover { background: #f8faff; }
    .btn-sm { padding: 8px 12px; font-size: 13px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .grid { display: grid; gap: 14px; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    .field { display: grid; gap: 6px; }
    label {
      color: #52607a;
      font-size: 12px;
      font-weight: 800;
    }
    input, select {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #d8dfeb;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    .status-line {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .status-line.success { color: var(--success); }
    .status-line.error { color: var(--danger); }
    .section-title {
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .kpi {
      padding: 14px;
      border: 1px solid #e3e8f2;
      border-radius: 14px;
      background: #f8faff;
    }
    .kpi-value {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.1;
    }
    .kpi-label {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .9fr);
      gap: 14px;
    }
    .table-wrap {
      overflow: auto;
      border: 1px solid #e3e8f2;
      border-radius: 12px;
      background: #fff;
    }
    table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #eef1f6;
      text-align: left;
      white-space: nowrap;
    }
    th {
      color: #52607a;
      background: #f8faff;
      font-size: 12px;
      font-weight: 900;
    }
    tr:last-child td { border-bottom: none; }
    .stage-cell {
      display: grid;
      gap: 3px;
      min-width: 260px;
    }
    .stage-name {
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.35;
    }
    .project-name {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
    }
    .hours-input {
      width: 96px;
      min-height: 34px;
      padding: 6px 8px;
    }
    .config-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
    }
    .config-filters {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 10px;
      align-items: end;
    }
    .config-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    @media (max-width: 900px) {
      .page { padding: 14px; }
      .page-header, .columns, .toolbar, .config-head, .config-filters { grid-template-columns: 1fr; }
      .header-actions, .config-actions { justify-content: stretch; }
      .header-actions button, .config-actions button { width: 100%; }
      .kpis { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <div class="header-kicker">工时统计</div>
        <h1>项目阶段工时统计</h1>
        <p class="subtitle">按时间、负责人统计阶段工作量；管理员可为每个项目阶段配置工时，并汇总总工时、个人工时和个人占比。</p>
      </div>
      <div class="header-actions">
        <button class="btn-primary" id="workload-export-btn" type="button">导出 Excel</button>
        <button class="btn-secondary" id="back-manage-btn" type="button">返回分配管理</button>
        <button class="btn-secondary" id="logout-btn" type="button">退出账号</button>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <div class="section-title">统计范围</div>
        <div class="toolbar">
          <div class="field">
            <label for="workload-granularity">统计周期</label>
            <select id="workload-granularity">
              <option value="day">按日</option>
              <option value="week">按周</option>
              <option value="month" selected>按月</option>
              <option value="year">按年</option>
            </select>
          </div>
          <div class="field">
            <label for="workload-maintainer">负责人</label>
            <select id="workload-maintainer">
              <option value="">全部负责人</option>
            </select>
          </div>
          <div class="field">
            <label for="workload-start">开始日期</label>
            <input id="workload-start" type="date">
          </div>
          <div class="field">
            <label for="workload-end">结束日期</label>
            <input id="workload-end" type="date">
          </div>
          <button class="btn-primary" id="workload-query-btn" type="button">统计</button>
        </div>
        <div class="status-line" id="workload-status"></div>
      </section>

      <section class="card">
        <div class="section-title">汇总结果</div>
        <div class="kpis">
          <div class="kpi">
            <div class="kpi-value" id="workload-total-hours">0</div>
            <div class="kpi-label">总工时</div>
          </div>
          <div class="kpi">
            <div class="kpi-value" id="workload-total-stages">0</div>
            <div class="kpi-label">阶段次数</div>
          </div>
          <div class="kpi">
            <div class="kpi-value" id="workload-person-share">0%</div>
            <div class="kpi-label">当前人员占比</div>
          </div>
        </div>
      </section>

      <section class="columns">
        <div class="card">
          <div class="section-title">人员工时</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>负责人</th>
                  <th>工时</th>
                  <th>阶段</th>
                  <th>占比</th>
                </tr>
              </thead>
              <tbody id="workload-people-body"></tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="section-title">周期分布</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>周期</th>
                  <th>工时</th>
                  <th>阶段</th>
                </tr>
              </thead>
              <tbody id="workload-period-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="config-head">
          <div>
            <div class="section-title">阶段工时配置</div>
            <div class="config-filters">
              <div class="field">
                <label for="workload-config-keyword">项目 / 阶段筛选</label>
                <input id="workload-config-keyword" type="search" placeholder="输入项目名称或阶段名称模糊查询">
              </div>
              <div class="field">
                <label for="workload-config-status-filter">工时状态</label>
                <select id="workload-config-status-filter">
                  <option value="all">全部阶段</option>
                  <option value="unset">未设置工时</option>
                  <option value="set">已设置工时</option>
                </select>
              </div>
            </div>
          </div>
          <div class="config-actions">
            <button class="btn-primary btn-sm" id="workload-save-config-btn" type="button">保存阶段工时</button>
            <button class="btn-secondary btn-sm" id="workload-reload-config-btn" type="button">重新加载</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>阶段名称</th>
                <th>单次工时</th>
                <th>出现次数</th>
                <th>合计工时</th>
              </tr>
            </thead>
            <tbody id="workload-config-body"></tbody>
          </table>
        </div>
        <div class="status-line" id="workload-config-status"></div>
      </section>
    </main>
  </div>

  <script>
    const buildAppUrl = (path) => {
      const normalized = path.startsWith("/") ? path : `/${path}`;
      const basePath = window.location.pathname.replace(/\/[^/]*$/, "");
      return `${basePath}${normalized}`;
    };

    async function apiFetch(url, options = {}) {
      return fetch(url, {
        credentials: "include",
        headers: {
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        },
        ...options
      });
    }

    async function getJson(url, options = {}) {
      const response = await apiFetch(url, options);
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) throw new Error(data?.detail || "请求失败");
      return data;
    }

    async function postJson(url, body) {
      return getJson(url, { method: "POST", body: JSON.stringify(body) });
    }

    const state = {
      auth: null,
      workloadConfigs: [],
      workloadStats: null
    };

    function escapeHtml(value) {
      return (value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function setStatus(id, text, type = "") {
      const element = document.getElementById(id);
      element.textContent = text || "";
      element.className = `status-line${type ? ` ${type}` : ""}`;
    }

    function formatHours(value) {
      const number = Number(value || 0);
      return Number.isInteger(number) ? String(number) : number.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    function buildWorkloadRequest() {
      return {
        granularity: document.getElementById("workload-granularity").value,
        maintainer: document.getElementById("workload-maintainer").value,
        configKeyword: document.getElementById("workload-config-keyword").value.trim(),
        configStatus: document.getElementById("workload-config-status-filter").value,
        rangeStart: document.getElementById("workload-start").value || null,
        rangeEnd: document.getElementById("workload-end").value || null
      };
    }

    function buildWorkloadConfigUrl() {
      const request = buildWorkloadRequest();
      const params = new URLSearchParams();
      if (request.rangeStart) params.set("rangeStart", request.rangeStart);
      if (request.rangeEnd) params.set("rangeEnd", request.rangeEnd);
      if (request.maintainer) params.set("maintainer", request.maintainer);
      const query = params.toString();
      return buildAppUrl(`/api/workload/stage-configs${query ? `?${query}` : ""}`);
    }

    function renderWorkloadConfig() {
      const body = document.getElementById("workload-config-body");
      const keyword = document.getElementById("workload-config-keyword").value.trim().toLowerCase();
      const statusFilter = document.getElementById("workload-config-status-filter").value;
      const stageStats = new Map((state.workloadStats?.stages || []).map(item => [`${item.projectName || ""}||${item.stageName}`, item]));
      const configs = state.workloadConfigs.filter(item => {
        const matchesKeyword = !keyword ||
          (item.projectName || "").toLowerCase().includes(keyword) ||
          (item.stageName || "").toLowerCase().includes(keyword);
        const hasConfiguredHours = Boolean(item.updatedAt);
        const matchesStatus = statusFilter === "all" ||
          (statusFilter === "unset" && !hasConfiguredHours) ||
          (statusFilter === "set" && hasConfiguredHours);
        return matchesKeyword && matchesStatus;
      });

      if (!state.workloadConfigs.length) {
        body.innerHTML = '<tr><td colspan="4">暂无阶段数据，请先更新中心库阶段汇总。</td></tr>';
        return;
      }

      if (!configs.length) {
        body.innerHTML = '<tr><td colspan="4">没有匹配的项目或阶段。</td></tr>';
        return;
      }

      body.innerHTML = configs.map(item => {
        const stat = stageStats.get(`${item.projectName || ""}||${item.stageName}`) || {};
        return `
          <tr>
            <td>
              <div class="stage-cell">
                <div class="stage-name">${escapeHtml(item.stageName)}</div>
                <div class="project-name">${escapeHtml(item.projectName || "未命名项目")}</div>
              </div>
            </td>
            <td><input class="hours-input" type="number" min="0" step="0.25" value="${escapeHtml(String(item.hours ?? 0))}" data-workload-project="${escapeHtml(item.projectName || "")}" data-workload-stage="${escapeHtml(item.stageName)}"></td>
            <td>${escapeHtml(String(stat.stageCount || 0))}</td>
            <td>${escapeHtml(formatHours(stat.hours || 0))}</td>
          </tr>`;
      }).join("");
    }

    function renderWorkloadStats() {
      const stats = state.workloadStats || { totalHours: 0, totalStages: 0, people: [], periods: [], stages: [] };
      const selectedMaintainer = document.getElementById("workload-maintainer").value;
      const selectedPerson = selectedMaintainer
        ? (stats.people || []).find(item => item.maintainer === selectedMaintainer)
        : null;

      document.getElementById("workload-total-hours").textContent = formatHours(stats.totalHours);
      document.getElementById("workload-total-stages").textContent = String(stats.totalStages || 0);
      document.getElementById("workload-person-share").textContent = selectedMaintainer
        ? `${formatHours(selectedPerson?.percent || 0)}%`
        : "100%";

      document.getElementById("workload-people-body").innerHTML = (stats.people || []).length
        ? stats.people.map(item => `
          <tr>
            <td>${escapeHtml(item.maintainer)}</td>
            <td>${escapeHtml(formatHours(item.hours))}</td>
            <td>${escapeHtml(String(item.stageCount))}</td>
            <td>${escapeHtml(formatHours(item.percent))}%</td>
          </tr>`).join("")
        : '<tr><td colspan="4">暂无工作量数据。</td></tr>';

      document.getElementById("workload-period-body").innerHTML = (stats.periods || []).length
        ? stats.periods.map(item => `
          <tr>
            <td>${escapeHtml(item.periodLabel)}</td>
            <td>${escapeHtml(formatHours(item.hours))}</td>
            <td>${escapeHtml(String(item.stageCount))}</td>
          </tr>`).join("")
        : '<tr><td colspan="3">暂无周期数据。</td></tr>';

      renderWorkloadConfig();
    }

    async function loadWorkloadConfigs() {
      state.workloadConfigs = await getJson(buildWorkloadConfigUrl());
      renderWorkloadConfig();
    }

    async function queryWorkloadStats(refreshConfigs = true) {
      setStatus("workload-status", "正在统计工时...");
      try {
        if (refreshConfigs !== false) await loadWorkloadConfigs();
        state.workloadStats = await postJson(buildAppUrl("/api/workload/stats"), buildWorkloadRequest());
        renderWorkloadStats();
        setStatus("workload-status", "工时统计完成。", "success");
      } catch (error) {
        state.workloadStats = null;
        renderWorkloadStats();
        setStatus("workload-status", error.message || "统计失败", "error");
      }
    }

    async function saveWorkloadConfigs() {
      const items = Array.from(document.querySelectorAll("[data-workload-stage]")).map(input => ({
        projectName: input.dataset.workloadProject,
        stageName: input.dataset.workloadStage,
        hours: Number(input.value || 0)
      }));

      setStatus("workload-config-status", "正在保存阶段工时...");
      try {
        const request = buildWorkloadRequest();
        state.workloadConfigs = await postJson(buildAppUrl("/api/workload/stage-configs"), {
          items,
          maintainer: request.maintainer,
          rangeStart: request.rangeStart,
          rangeEnd: request.rangeEnd
        });
        await queryWorkloadStats(false);
        setStatus("workload-config-status", "阶段工时已保存。", "success");
      } catch (error) {
        setStatus("workload-config-status", error.message || "保存失败", "error");
      }
    }

    async function exportWorkload() {
      setStatus("workload-status", "正在生成导出文件...");
      try {
        const response = await apiFetch(buildAppUrl("/api/workload/export"), {
          method: "POST",
          body: JSON.stringify(buildWorkloadRequest())
        });
        if (!response.ok) {
          const text = await response.text();
          const data = text ? JSON.parse(text) : null;
          throw new Error(data?.detail || "导出失败");
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "工时统计.xlsx";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        setStatus("workload-status", "导出文件已生成。", "success");
      } catch (error) {
        setStatus("workload-status", error.message || "导出失败", "error");
      }
    }

    async function ensureAdmin() {
      const auth = await getJson(buildAppUrl("/api/auth/status"));
      state.auth = auth;
      if (!auth.authenticated) {
        window.location.href = buildAppUrl("/");
        return false;
      }
      if (!auth.isAdmin) {
        document.body.innerHTML = '<div class="page"><h1 style="margin-top:40px">无权访问</h1><p style="color:var(--muted);margin-top:8px">工时统计仅管理员可见。</p></div>';
        return false;
      }
      return true;
    }

    async function loadMaintainers() {
      const users = await getJson(buildAppUrl("/api/auth/users"));
      const select = document.getElementById("workload-maintainer");
      select.innerHTML = '<option value="">全部负责人</option>' +
        users.map(user => `<option value="${escapeHtml(user.username)}">${escapeHtml(user.username)}（${escapeHtml(user.role)}）</option>`).join("");
    }

    document.getElementById("back-manage-btn").addEventListener("click", () => {
      window.location.href = buildAppUrl("/manage.html");
    });
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await postJson(buildAppUrl("/api/auth/logout"), {});
      window.location.href = buildAppUrl("/");
    });
    document.getElementById("workload-query-btn").addEventListener("click", queryWorkloadStats);
    document.getElementById("workload-export-btn").addEventListener("click", exportWorkload);
    document.getElementById("workload-config-keyword").addEventListener("input", renderWorkloadConfig);
    document.getElementById("workload-config-status-filter").addEventListener("change", renderWorkloadConfig);
    document.getElementById("workload-save-config-btn").addEventListener("click", saveWorkloadConfigs);
    document.getElementById("workload-reload-config-btn").addEventListener("click", async () => {
      setStatus("workload-config-status", "正在重新加载阶段工时配置...");
      try {
        await loadWorkloadConfigs();
        await queryWorkloadStats(false);
        setStatus("workload-config-status", "阶段工时配置已重新加载。", "success");
      } catch (error) {
        setStatus("workload-config-status", error.message || "重新加载失败", "error");
      }
    });

    (async function bootstrap() {
      const allowed = await ensureAdmin();
      if (!allowed) return;
      const now = new Date();
      document.getElementById("workload-start").value = `${now.getFullYear()}-01-01`;
      document.getElementById("workload-end").value = `${now.getFullYear()}-12-31`;
      await loadMaintainers();
      await queryWorkloadStats();
    })();
  </script>
</body>
</html>
