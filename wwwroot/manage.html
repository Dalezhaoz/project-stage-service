<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目阶段管理台</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --line: #e2e5ed;
      --text: #1a1d26;
      --muted: #6e7687;
      --primary: #3b5bdb;
      --primary-hover: #2b4acb;
      --primary-light: #edf2ff;
      --primary-border: #bac8ff;
      --danger: #e03131;
      --success: #099268;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.03);
      --shadow-md: 0 4px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;
      --transition: .18s cubic-bezier(.4,0,.2,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Layout ---- */
    .page { max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px; }

    .page-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      margin-bottom: 16px;
      padding: 18px 20px;
      background:
        radial-gradient(circle at top right, rgba(59, 91, 219, 0.08), transparent 34%),
        linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
      border: 1px solid #dbe3f5;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .page-header-left {
      min-width: 0;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .header-kicker {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .header-breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: #7a869c;
      font-size: 12px;
      font-weight: 700;
    }
    .header-breadcrumb strong {
      color: #41506b;
    }
    .header-breadcrumb .sep {
      color: #b0b8c8;
    }
    .page-header-left h1 {
      font-size: 28px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--text);
    }
    .page-header-left .subtitle {
      max-width: 720px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .header-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .header-note,
    .auth-user {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .header-note {
      color: #52607a;
      background: #f6f8fc;
      border: 1px solid #e3e8f2;
    }
    .auth-user {
      color: var(--primary);
      background: #f0f4ff;
      border: 1px solid #d7e3ff;
    }
    .page-header-right {
      display: grid;
      gap: 10px;
      justify-items: end;
      align-content: start;
    }
    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .header-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(110px, 1fr));
      gap: 10px;
      min-width: min(100%, 420px);
    }
    .header-summary-card {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.82);
      border: 1px solid #e1e7f2;
      box-shadow: var(--shadow-sm);
    }
    .header-summary-label {
      color: #6b7890;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }
    .header-summary-value {
      margin-top: 4px;
      color: var(--text);
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .header-summary-meta {
      margin-top: 4px;
      color: #7f8aa0;
      font-size: 11px;
      line-height: 1.4;
    }
    .header-action-btn {
      border: 1px solid #d8dfeb;
      background: #fff;
      color: #44506a;
      font-size: 13px;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: none;
    }
    .header-action-btn:hover {
      background: #f8faff;
      border-color: #c8d4ef;
      color: var(--text);
      transform: translateY(-1px);
    }
    .header-action-btn.header-action-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .header-action-btn.header-action-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #fff;
    }
    .header-action-btn.header-action-danger {
      color: var(--danger);
      border-color: #fecaca;
    }
    .header-action-btn.header-action-danger:hover {
      background: #fff5f5;
      border-color: #fca5a5;
      color: #b42318;
    }

    /* ---- Assign Drawer ---- */
    .assign-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.22);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      z-index: 90;
    }
    .assign-drawer-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .assign-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: min(360px, calc(100vw - 24px));
      height: 100vh;
      padding: 22px 18px 18px;
      background: linear-gradient(180deg, #ffffff 0%, #f8faff 100%);
      border-right: 1px solid #dbe3f5;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      transform: translateX(calc(-100% - 24px));
      transition: transform var(--transition);
      z-index: 100;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 16px;
      overflow: auto;
    }
    .assign-drawer.show {
      transform: translateX(0);
    }
    .assign-drawer-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .assign-drawer-copy {
      display: grid;
      gap: 6px;
    }
    .assign-drawer-eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .assign-drawer-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--text);
    }
    .assign-drawer-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .assign-drawer-close {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid #d8dfeb;
      background: #fff;
      color: #52607a;
      box-shadow: none;
      flex: none;
    }
    .assign-drawer-close:hover {
      background: #f8faff;
      border-color: #c8d4ef;
      color: var(--text);
    }
    .assign-drawer-section {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid #e3e8f2;
      border-radius: 16px;
      background: rgba(255,255,255,.92);
    }
    .assign-drawer-section .card-title {
      margin: 0;
    }

    .layout { display: grid; gap: 14px; }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow);
    }

    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text); }

    /* ---- Form Elements ---- */
    label { display: block; margin: 0 0 4px; font-size: 13px; color: #374151; font-weight: 600; }
    input, select, button { font: inherit; }
    input, select {
      width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--line); background: #fff; color: var(--text);
      font-size: 14px; transition: border-color var(--transition), box-shadow var(--transition);
    }
    input:focus, select:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }
    input::placeholder { color: #9ca3af; }

    /* ---- Buttons ---- */
    button {
      border: none; border-radius: var(--radius-sm); padding: 8px 16px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all var(--transition); display: inline-flex; align-items: center;
      justify-content: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: var(--shadow); }
    .btn-secondary { background: #fff; color: #374151; border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
    .btn-secondary:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:active:not(:disabled) { transform: scale(.98); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    /* ---- Status Line ---- */
    .status-line { min-height: 20px; font-size: 13px; color: var(--muted); margin-top: 8px; }
    .status-line.error { color: var(--danger); }
    .status-line.success { color: var(--success); }

    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* ---- Filter Grid ---- */
    .filter-grid {
      display: grid;
      grid-template-columns: auto 1.35fr 0.9fr 0.9fr 0.9fr 0.9fr auto;
      gap: 10px;
      align-items: end;
    }
    .filter-grid .actions-col,
    .filter-grid .hint,
    .filter-grid .status-line {
      grid-column: 1 / -1;
    }
    .field { display: grid; gap: 4px; }
    .field.inline-field { gap: 4px; min-width: 0; }
    .filter-workbench {
      display: grid;
      gap: 10px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
    }
    .filter-sections {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .filter-section {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid #e5eaf3;
      border-radius: 14px;
      background: rgba(255,255,255,.9);
    }
    .filter-section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .filter-section-desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-input {
      flex: 1;
      min-width: 90px;
      padding: 7px 10px;
      font-size: 13px;
      min-height: 36px;
      width: auto;
    }

    /* ---- Status Filter Tags ---- */
    .tag-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-option {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      user-select: none;
    }
    .tag-option.active {
      background: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary);
    }

    /* ---- Content Grid ---- */
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    /* ---- List Header ---- */
    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .list-head .card-title { margin: 0; }
    .count-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--line); background: #fff;
      font-size: 13px; font-weight: 700; color: var(--text);
    }

    /* ---- Project Rows ---- */
    .project-list { display: grid; gap: 10px; }

    .project-row {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      background: var(--card);
      display: grid;
      gap: 10px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .project-row:hover {
      border-color: var(--primary-border);
      box-shadow: var(--shadow-md);
    }
    .project-row.selected {
      border-color: var(--primary-border);
      background: var(--primary-light);
      box-shadow: var(--shadow-md);
    }

    .project-row-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .project-title { font-size: 15px; font-weight: 700; line-height: 1.3; }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    /* ---- Status Badges ---- */
    .status-badge {
      display: inline-flex; align-items: center;
      border-radius: 999px; padding: 3px 9px;
      font-size: 12px; font-weight: 700; white-space: nowrap;
      background: #f2f4f8; color: #6c778d;
    }
    .status-ongoing  { background: #e6fcf5; color: var(--success); }
    .status-upcoming { background: var(--primary-light); color: var(--primary); }
    .status-ended    { background: #f2f4f8; color: #6c778d; }

    .project-row-actions {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    }

    .select-btn {
      border: 1px solid var(--line); background: #fff; color: #374151;
      border-radius: 999px; padding: 4px 12px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: all var(--transition); white-space: nowrap;
    }
    .select-btn:hover { border-color: var(--primary-border); color: var(--primary); }
    .select-btn.active {
      background: var(--primary); border-color: var(--primary); color: #fff;
    }

    /* ---- Pill Row ---- */
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .value-pill {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 999px;
      background: var(--primary-light); border: 1px solid var(--primary-border);
      color: var(--primary); font-weight: 700; font-size: 13px;
    }
    .value-pill.empty {
      color: var(--muted); background: #f7f9fc; border-color: var(--line);
    }

    /* ---- Quick Edit Row ---- */
    .quick-edit-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .quick-edit-row select {
      min-width: 160px; max-width: 240px; height: 34px; width: auto;
      padding: 0 10px; font-size: 13px;
    }
    .row-save-status {
      font-size: 12px; color: var(--muted);
    }
    .row-save-status.error { color: var(--danger); }
    .row-save-status.success { color: var(--success); }

    /* ---- Summary Stats ---- */
    .summary-stats {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
      margin-top: 10px;
    }
    .summary-stat {
      border: 1px solid var(--line); border-radius: var(--radius); padding: 10px;
      background: #fafbfc; text-align: center;
    }
    .summary-stat-number { display: block; font-size: 22px; font-weight: 900; line-height: 1; }
    .summary-stat-label { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); font-weight: 700; }

    /* ---- Assign Panel ---- */
    .assign-panel { display: grid; gap: 12px; }

    /* ---- Check Grid (App Servers) ---- */
    .check-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 6px;
    }
    .check-card {
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 8px 10px; background: #fff;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none; font-size: 13px; font-weight: 600;
      transition: all var(--transition);
    }
    .check-card.active {
      background: var(--primary-light); border-color: var(--primary-border);
      color: var(--primary);
    }
    .check-card input { width: 16px; height: 16px; margin: 0; flex: none; width: auto; }

    /* ---- Empty State ---- */
    .empty-state {
      padding: 28px; text-align: center; color: var(--muted);
      border: 1px dashed var(--line); border-radius: var(--radius-lg);
      background: #fafbfc; font-size: 14px;
    }

    @media (max-width: 1240px) {
      .filter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 980px) {
      .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-grid.compact { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .page { padding: 14px 16px 32px; }
      .filter-grid { grid-template-columns: 1fr; }
      .filter-grid.compact { grid-template-columns: 1fr; }
      .page-header {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 14px;
      }
      .page-header-left h1 { font-size: 23px; }
      .page-header-left .subtitle { font-size: 13px; }
      .page-header-right {
        width: 100%;
        justify-items: stretch;
      }
      .header-summary {
        min-width: 0;
        width: 100%;
      }
      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }
      .header-actions .header-action-btn {
        flex: 1 1 calc(50% - 8px);
      }
      .header-note,
      .auth-user {
        width: 100%;
        justify-content: center;
      }
      .header-summary {
        grid-template-columns: 1fr;
      }
      .filter-sections { grid-template-columns: 1fr; }
      .assign-drawer {
        width: 100vw;
        border-right: none;
      }
    }
  </style>
</head>
<body>
    <div class="page">
      <div class="page-header">
        <div class="page-header-left">
          <span class="header-kicker">管理后台</span>
          <div class="header-breadcrumb">
            <span>项目阶段服务</span>
            <span class="sep">/</span>
            <span>运营配置</span>
            <span class="sep">/</span>
            <strong>分配管理</strong>
          </div>
          <h1>项目分配管理</h1>
          <span class="subtitle">集中维护负责人、应用服务器和批量分配策略，适合管理员与内部用户进行日常运营配置。</span>
          <div class="header-meta">
            <span class="header-note">建议先筛选项目范围，再批量保存分配结果</span>
            <span class="auth-user" id="auth-chip">当前未登录</span>
          </div>
        </div>
        <div class="page-header-right">
          <div class="header-summary">
            <div class="header-summary-card">
              <div class="header-summary-label">当前结果</div>
              <div class="header-summary-value" id="header-result-count">0</div>
              <div class="header-summary-meta">筛选后的项目数</div>
            </div>
            <div class="header-summary-card">
              <div class="header-summary-label">已选项目</div>
              <div class="header-summary-value" id="header-selected-count">0</div>
              <div class="header-summary-meta">待批量处理</div>
            </div>
            <div class="header-summary-card">
              <div class="header-summary-label">应用服务器</div>
              <div class="header-summary-value" id="header-selected-apps">0</div>
              <div class="header-summary-meta">选中项目覆盖数</div>
            </div>
          </div>
          <div class="header-actions">
            <button class="header-action-btn" id="toggle-assign-panel" type="button">批量分配</button>
            <button class="header-action-btn header-action-primary" id="open-main-btn" type="button">返回查询中心</button>
            <button class="header-action-btn header-action-danger" id="logout-btn" type="button">退出账号</button>
          </div>
        </div>
      </div>

      <div class="assign-drawer-overlay" id="assign-panel-overlay"></div>
      <aside class="assign-drawer" id="assign-panel" aria-hidden="true">
        <div class="assign-drawer-head">
          <div class="assign-drawer-copy">
            <div class="assign-drawer-eyebrow">Batch Assign</div>
            <div class="assign-drawer-title">批量分配</div>
            <div class="assign-drawer-desc">查看当前选中项目，并在这里统一保存负责人和应用服务器。</div>
          </div>
          <button id="close-assign-panel" type="button" class="assign-drawer-close" aria-label="关闭批量分配">×</button>
        </div>

        <section class="assign-drawer-section">
          <div class="card-title">当前选中</div>
          <div class="summary-stats">
            <div class="summary-stat">
              <span class="summary-stat-number" id="selected-count">0</span>
              <span class="summary-stat-label">项目数</span>
            </div>
            <div class="summary-stat">
              <span class="summary-stat-number" id="selected-servers">0</span>
              <span class="summary-stat-label">数据库</span>
            </div>
            <div class="summary-stat">
              <span class="summary-stat-number" id="selected-apps">0</span>
              <span class="summary-stat-label">应用服务器</span>
            </div>
          </div>
        </section>

        <section class="assign-drawer-section assign-panel">
          <div class="card-title">批量分配</div>
          <div class="field">
            <label for="batch-maintainer">负责人</label>
            <select id="batch-maintainer">
              <option value="">未指定</option>
            </select>
          </div>

          <div class="field">
            <label>应用服务器</label>
            <div id="batch-app-servers" class="check-grid"></div>
            <div class="hint" id="batch-app-hint">正在加载可选应用服务器...</div>
          </div>

          <div class="actions">
            <button class="btn-primary" type="button" id="save-batch-btn">保存选中项目</button>
            <button class="btn-secondary" type="button" id="clear-selection-btn">清空选中</button>
          </div>
          <div class="status-line" id="batch-status"></div>
        </section>
      </aside>
    <div class=”layout”>
      <div class=”card”>
        <div class=”filter-workbench”>
          <div class=”filter-sections”>
            <section class=”filter-section”>
              <div class=”filter-section-head”>
                <div class=”filter-section-title”>基础筛选</div>
                <div class=”filter-section-desc”>状态、项目名称、来源库范围</div>
              </div>
              <div class=”filter-row”>
                <div class=”tag-group”>
                  <span class=”tag-option active” data-status=”正在进行”>正在进行</span>
                  <span class=”tag-option active” data-status=”即将开始”>即将开始</span>
                  <span class=”tag-option active” data-status=”已结束”>已结束</span>
                </div>
              </div>
              <div class=”filter-row”>
                <input id=”project-keyword” placeholder=”项目关键词” class=”filter-input”>
                <input id=”server-keyword” placeholder=”数据库服务器” class=”filter-input”>
                <input id=”exam-keyword” placeholder=”考试代码” class=”filter-input” style=”max-width:120px;”>
              </div>
            </section>

            <section class=”filter-section”>
              <div class=”filter-section-head”>
                <div class=”filter-section-title”>分配筛选</div>
                <div class=”filter-section-desc”>负责人、分配状态</div>
              </div>
              <div class=”field”>
                <label for=”maintainer-filter”>负责人</label>
                <select id=”maintainer-filter”>
                  <option value=””>全部负责人</option>
                </select>
              </div>
              <div class=”field”>
                <label for=”assignment-filter”>分配状态</label>
                <select id=”assignment-filter”>
                  <option value=”all”>全部项目</option>
                  <option value=”unassigned”>仅未分配负责人</option>
                  <option value=”assigned”>仅已分配负责人</option>
                </select>
              </div>
              <div class=”actions” style=”margin-top:4px;”>
                <button class=”btn-primary btn-sm” type=”button” id=”query-btn”>查询项目</button>
                <button class=”btn-secondary btn-sm” type=”button” id=”reset-btn”>重置</button>
              </div>
              <div class=”status-line” id=”query-status”></div>
            </section>
          </div>
        </div>
      </div>

      <div class="content-grid">
        <div class="card">
          <div class="list-head">
            <div class="card-title">项目列表</div>
            <span class="count-chip"><span id="result-count">0</span> 个项目</span>
          </div>
          <div id="project-list" class="project-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const buildAppUrl = (path) => {
      const normalized = path.startsWith("/") ? path : `/${path}`;
      const basePath = window.location.pathname.replace(/\/[^/]*$/, "");
      return `${basePath}${normalized}`;
    };

    async function apiFetch(url, options = {}) {
      return fetch(url, {
        credentials: "include",
        headers: {
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        },
        ...options
      });
    }

    async function getJson(url, options = {}) {
      const response = await apiFetch(url, options);
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) {
        throw new Error(data?.detail || "请求失败");
      }
      return data;
    }

    async function postJson(url, body) {
      return getJson(url, { method: "POST", body: JSON.stringify(body) });
    }

    const state = {
      auth: null,
      users: [],
      metadata: [],
      metadataMap: new Map(),
      appServerOptions: [],
      projects: [],
      filteredProjects: [],
      selectedKeys: new Set()
    };

    function escapeHtml(value) {
      return (value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function getProjectKey(item) {
      return `${item.serverName}::${item.databaseName}::${item.examCode}`;
    }

    function parseAppServers(raw) {
      return (raw || "")
        .split(/[、,，;；\r\n]+/)
        .map(item => item.trim())
        .filter(Boolean);
    }

    function setStatus(id, text, type = "") {
      const element = document.getElementById(id);
      element.textContent = text || "";
      element.className = `status-line${type ? ` ${type}` : ""}`;
    }

    function syncMetadataMap() {
      state.metadataMap = new Map(
        state.metadata
          .filter(item => item.databaseName)
          .map(item => [`${item.serverName}::${item.databaseName}::${item.examCode}`, item])
      );
    }

    function getSelectedStatuses() {
      return Array.from(document.querySelectorAll(".tag-option.active")).map(el => el.dataset.status);
    }

    function buildQueryRequest() {
      return {
        statusFilters: getSelectedStatuses(),
        timeMatchMode: "overlap",
        stageKeyword: "",
        stageNames: [],
        serverNames: [],
        projectKeyword: document.getElementById("project-keyword").value.trim(),
        serverKeyword: document.getElementById("server-keyword").value.trim(),
        databaseKeyword: "",
        examCodeKeyword: document.getElementById("exam-keyword").value.trim(),
        rangeStart: null,
        rangeEnd: null,
        dayOffsets: []
      };
    }

    function fillMaintainerSelects() {
      const filter = document.getElementById("maintainer-filter");
      const batch = document.getElementById("batch-maintainer");
      const options = ['<option value="">全部负责人</option>']
        .concat(state.users.map(user => `<option value="${escapeHtml(user.username)}">${escapeHtml(user.username)}（${escapeHtml(user.role)}）</option>`));
      filter.innerHTML = options.join("");
      batch.innerHTML = '<option value="">未指定</option>' +
        state.users.map(user => `<option value="${escapeHtml(user.username)}">${escapeHtml(user.username)}（${escapeHtml(user.role)}）</option>`).join("");
    }

    function renderAppServerOptions() {
      const container = document.getElementById("batch-app-servers");
      const hint = document.getElementById("batch-app-hint");
      if (!state.appServerOptions.length) {
        container.innerHTML = "";
        hint.textContent = "还没有可选应用服务器，请先在正式页面里维护应用服务器配置。";
        return;
      }

      hint.textContent = `共 ${state.appServerOptions.length} 个可选应用服务器。`;
      container.innerHTML = state.appServerOptions.map(item => {
        const value = escapeHtml(item.name);
        return `
          <label class="check-card" data-app-option="${value}">
            <input type="checkbox" value="${value}">
            <span>${value}</span>
          </label>`;
      }).join("");
    }

    function getProjectMaintainer(project) {
      return state.metadataMap.get(getProjectKey(project))?.maintainer || "";
    }

    function getProjectAppServers(project) {
      return parseAppServers(state.metadataMap.get(getProjectKey(project))?.appServers || "");
    }

    function applyProjectFilters() {
      const maintainerFilter = document.getElementById("maintainer-filter").value;
      const assignmentFilter = document.getElementById("assignment-filter").value;

      state.filteredProjects = state.projects.filter(project => {
        const maintainer = getProjectMaintainer(project);
        if (maintainerFilter && maintainer !== maintainerFilter) {
          return false;
        }

        if (assignmentFilter === "unassigned" && maintainer) {
          return false;
        }

        if (assignmentFilter === "assigned" && !maintainer) {
          return false;
        }

        return true;
      });
    }

    function renderProjectList() {
      applyProjectFilters();
      const container = document.getElementById("project-list");
      document.getElementById("result-count").textContent = String(state.filteredProjects.length);
      document.getElementById("header-result-count").textContent = String(state.filteredProjects.length);

      if (!state.filteredProjects.length) {
        container.innerHTML = '<div class="empty-state">没有符合条件的项目。</div>';
        renderSelectionSummary();
        return;
      }

      container.innerHTML = state.filteredProjects.map(project => {
        const key = getProjectKey(project);
        const maintainer = getProjectMaintainer(project);
        const appServers = getProjectAppServers(project);
        const statuses = Array.isArray(project.statuses) ? project.statuses : [];
        const status = statuses.includes("正在进行")
          ? "正在进行"
          : statuses.includes("即将开始")
            ? "即将开始"
            : "已结束";
        const statusClass = status === "正在进行"
          ? "status-ongoing"
          : status === "即将开始"
            ? "status-upcoming"
            : "status-ended";
        const selected = state.selectedKeys.has(key) ? " selected" : "";

        return `
          <article class="project-row${selected}" data-key="${escapeHtml(key)}">
            <div class="project-row-top">
              <div>
                <div class="project-title">${escapeHtml(project.projectName)}</div>
                <div class="project-meta">
                  <span>${escapeHtml(project.serverName)} / ${escapeHtml(project.databaseName)}</span>
                  <span>考试代码：${escapeHtml(project.examCode)}</span>
                </div>
              </div>
              <div class="project-row-actions">
                <button type="button" class="select-btn${state.selectedKeys.has(key) ? " active" : ""}" data-select-key="${escapeHtml(key)}">
                  ${state.selectedKeys.has(key) ? "已选" : "选择"}
                </button>
                <span class="status-badge ${statusClass}">${escapeHtml(status)}</span>
              </div>
            </div>
            <div class="pill-row">
              ${maintainer
                ? `<span class="value-pill">${escapeHtml(maintainer)}</span>`
                : '<span class="value-pill empty">未指定负责人</span>'}
              ${appServers.length
                ? appServers.map(item => `<span class="value-pill">${escapeHtml(item)}</span>`).join("")
                : '<span class="value-pill empty">未分配应用服务器</span>'}
            </div>
            <div class="quick-edit-row">
              <select data-maintainer-select="${escapeHtml(key)}">
                <option value="">未指定负责人</option>
                ${state.users.map(user => `
                  <option value="${escapeHtml(user.username)}" ${user.username === maintainer ? "selected" : ""}>
                    ${escapeHtml(user.username)}（${escapeHtml(user.role)}）
                  </option>`).join("")}
              </select>
              <button type="button" class="btn-primary btn-sm" data-save-maintainer="${escapeHtml(key)}">保存</button>
              <span class="row-save-status" data-save-status="${escapeHtml(key)}"></span>
            </div>
          </article>
        `;
      }).join("");

      renderSelectionSummary();
    }

    function renderSelectionSummary() {
      const selectedProjects = state.filteredProjects.filter(project => state.selectedKeys.has(getProjectKey(project)));
      document.getElementById("selected-count").textContent = String(selectedProjects.length);
      document.getElementById("selected-servers").textContent = String(new Set(selectedProjects.map(item => item.serverName)).size);
      document.getElementById("selected-apps").textContent = String(new Set(selectedProjects.flatMap(item => getProjectAppServers(item))).size);
      document.getElementById("header-selected-count").textContent = String(selectedProjects.length);
      document.getElementById("header-selected-apps").textContent = String(new Set(selectedProjects.flatMap(item => getProjectAppServers(item))).size);
    }

    function setAssignPanelOpen(open) {
      const panel = document.getElementById("assign-panel");
      const overlay = document.getElementById("assign-panel-overlay");
      const button = document.getElementById("toggle-assign-panel");
      panel.classList.toggle("show", open);
      overlay.classList.toggle("show", open);
      panel.setAttribute("aria-hidden", open ? "false" : "true");
      button.textContent = open ? "收起分配" : "批量分配";
    }

    async function ensureAuth() {
      const auth = await getJson(buildAppUrl("/api/auth/status"));
      state.auth = auth;
      const roleLabels = {
        admin: "管理员",
        internal: "内部用户",
        external: "外部用户"
      };
      document.getElementById("auth-chip").textContent = auth.authenticated
        ? `当前账号：${auth.username}（${roleLabels[auth.role] || auth.role}）`
        : "当前未登录";

      if (!auth.authenticated) {
        window.location.href = buildAppUrl("/");
        return false;
      }

      if (!(auth.role === "admin" || auth.role === "internal")) {
        document.body.innerHTML = '<div class="page"><h1 style="margin-top:40px">无权访问</h1><p style="color:var(--muted);margin-top:8px">本地管理页仅开放给管理员和内部用户。</p></div>';
        return false;
      }

      return true;
    }

    async function loadBaseData() {
      const [users, metadata, appServers] = await Promise.all([
        getJson(buildAppUrl("/api/auth/users")),
        getJson(buildAppUrl("/api/project-metadata")),
        getJson(buildAppUrl("/api/app-server-options"))
      ]);

      state.users = users;
      state.metadata = metadata;
      state.appServerOptions = appServers;
      syncMetadataMap();
      fillMaintainerSelects();
      renderAppServerOptions();
    }

    async function queryProjects() {
      setStatus("query-status", "正在查询项目...");
      try {
        const summary = await postJson(buildAppUrl("/api/query"), buildQueryRequest());
        state.projects = Array.isArray(summary.groups) ? summary.groups : [];
        renderProjectList();
        setStatus("query-status", `查询完成，共 ${state.projects.length} 个项目。`, "success");
      } catch (error) {
        state.projects = [];
        renderProjectList();
        setStatus("query-status", error.message || "查询失败", "error");
      }
    }

    function getSelectedAppServers() {
      return Array.from(document.querySelectorAll('#batch-app-servers input[type="checkbox"]:checked')).map(input => input.value);
    }

    async function saveBatch() {
      const selectedProjects = state.filteredProjects.filter(project => state.selectedKeys.has(getProjectKey(project)));
      if (!selectedProjects.length) {
        setStatus("batch-status", "请先选择至少一个项目。", "error");
        return;
      }

      const maintainer = document.getElementById("batch-maintainer").value;
      const appServers = getSelectedAppServers().join("、");

      setStatus("batch-status", `正在保存 ${selectedProjects.length} 个项目...`);
      try {
        for (const project of selectedProjects) {
          await postJson(buildAppUrl("/api/project-metadata"), {
            serverName: project.serverName,
            databaseName: project.databaseName,
            examCode: project.examCode,
            maintainer,
            appServers
          });
        }

        state.metadata = await getJson(buildAppUrl("/api/project-metadata"));
        syncMetadataMap();
        renderProjectList();
        setStatus("batch-status", `已保存 ${selectedProjects.length} 个项目。`, "success");
      } catch (error) {
        setStatus("batch-status", error.message || "保存失败", "error");
      }
    }

    document.querySelectorAll(".tag-option").forEach(el => {
      el.addEventListener("click", () => {
        el.classList.toggle("active");
      });
    });

    document.getElementById("query-btn").addEventListener("click", queryProjects);
    document.getElementById("reset-btn").addEventListener("click", () => {
      document.getElementById("project-keyword").value = "";
      document.getElementById("server-keyword").value = "";
      document.getElementById("exam-keyword").value = "";
      document.getElementById("maintainer-filter").value = "";
      document.getElementById("assignment-filter").value = "all";
      document.querySelectorAll(".tag-option").forEach(el => el.classList.add("active"));
      renderProjectList();
      setStatus("query-status", "");
    });

    document.getElementById("maintainer-filter").addEventListener("change", renderProjectList);
    document.getElementById("assignment-filter").addEventListener("change", renderProjectList);

    document.getElementById("project-list").addEventListener("click", (event) => {
      const selectButton = event.target.closest("[data-select-key]");
      if (selectButton) {
        event.stopPropagation();
        const key = selectButton.dataset.selectKey;
        if (state.selectedKeys.has(key)) {
          state.selectedKeys.delete(key);
        } else {
          state.selectedKeys.add(key);
        }
        renderProjectList();
        return;
      }

      const saveMaintainerButton = event.target.closest("[data-save-maintainer]");
      if (saveMaintainerButton) {
        event.stopPropagation();
        return;
      }

      const interactive = event.target.closest("select, input, textarea, button, a, label");
      if (interactive) {
        return;
      }

      const row = event.target.closest(".project-row");
      if (!row) return;
      const key = row.dataset.key;
      if (state.selectedKeys.has(key)) {
        state.selectedKeys.delete(key);
      } else {
        state.selectedKeys.add(key);
      }
      renderProjectList();
    });

    document.getElementById("project-list").addEventListener("change", async (event) => {
      const select = event.target.closest("[data-maintainer-select]");
      if (!select) return;
      select.dataset.dirty = "true";
    });

    document.getElementById("project-list").addEventListener("click", async (event) => {
      const saveButton = event.target.closest("[data-save-maintainer]");
      if (!saveButton) return;

      event.stopPropagation();
      const key = saveButton.dataset.saveMaintainer;
      const select = document.querySelector(`[data-maintainer-select="${CSS.escape(key)}"]`);
      if (!select) return;

      const project = state.filteredProjects.find(item => getProjectKey(item) === key);
      if (!project) return;

      const rowStatus = document.querySelector(`[data-save-status="${CSS.escape(key)}"]`);
      const showRowStatus = (text, type = "") => {
        if (!rowStatus) return;
        rowStatus.textContent = text;
        rowStatus.className = `row-save-status${type ? ` ${type}` : ""}`;
      };

      saveButton.disabled = true;
      showRowStatus("保存中…");
      try {
        const existing = state.metadataMap.get(key);
        await postJson(buildAppUrl("/api/project-metadata"), {
          serverName: project.serverName,
          databaseName: project.databaseName,
          examCode: project.examCode,
          maintainer: select.value,
          appServers: existing?.appServers || ""
        });

        state.metadata = await getJson(buildAppUrl("/api/project-metadata"));
        syncMetadataMap();
        renderProjectList();
      } catch (error) {
        saveButton.disabled = false;
        showRowStatus(error.message || "保存失败", "error");
      }
    });

    document.getElementById("batch-app-servers").addEventListener("change", (event) => {
      const card = event.target.closest(".check-card");
      if (!card) return;
      card.classList.toggle("active", event.target.checked);
    });

    document.getElementById("clear-selection-btn").addEventListener("click", () => {
      state.selectedKeys.clear();
      renderProjectList();
      setStatus("batch-status", "已清空选中项目。");
    });

    document.getElementById("save-batch-btn").addEventListener("click", saveBatch);
    document.getElementById("toggle-assign-panel").addEventListener("click", () => {
      const panel = document.getElementById("assign-panel");
      setAssignPanelOpen(!panel.classList.contains("show"));
    });
    document.getElementById("close-assign-panel").addEventListener("click", () => setAssignPanelOpen(false));
    document.getElementById("assign-panel-overlay").addEventListener("click", () => setAssignPanelOpen(false));

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await postJson(buildAppUrl("/api/auth/logout"), {});
      window.location.href = buildAppUrl("/");
    });

    document.getElementById("open-main-btn").addEventListener("click", () => {
      window.location.href = buildAppUrl("/");
    });

    (async function bootstrap() {
      const allowed = await ensureAuth();
      if (!allowed) return;
      await loadBaseData();
      await queryProjects();
    })();
  </script>
</body>
</html>
