<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目阶段管理台</title>
  <style>
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --line: #e2e5ed;
      --text: #1a1d26;
      --muted: #6e7687;
      --primary: #3b5bdb;
      --primary-hover: #2b4acb;
      --primary-light: #edf2ff;
      --primary-border: #bac8ff;
      --danger: #e03131;
      --success: #099268;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.03);
      --shadow-md: 0 4px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;
      --transition: .18s cubic-bezier(.4,0,.2,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Layout ---- */
    .page { max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px; }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 16px; padding: 0 2px;
    }
    .page-header-left { display: flex; align-items: center; gap: 12px; }
    .page-header-left h1 {
      font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: var(--text);
      white-space: nowrap;
    }
    .page-header-left .subtitle {
      color: var(--muted); font-size: 12px; border-left: 1px solid var(--line);
      padding-left: 12px; line-height: 1.3;
    }
    .page-header-right { display: flex; align-items: center; gap: 8px; }
    .page-header-right .auth-user {
      padding: 4px 10px; background: #f0f4ff; border-radius: 999px;
      font-size: 12px; font-weight: 600; color: var(--primary);
    }
    .header-action-btn {
      border: none; background: none; color: var(--muted); font-size: 12px;
      cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); font-weight: 500;
    }
    .header-action-btn:hover { background: #f3f4f6; color: var(--text); }

    .layout { display: grid; gap: 14px; }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow);
    }

    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text); }

    /* ---- Form Elements ---- */
    label { display: block; margin: 0 0 4px; font-size: 13px; color: #374151; font-weight: 600; }
    input, select, button { font: inherit; }
    input, select {
      width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--line); background: #fff; color: var(--text);
      font-size: 14px; transition: border-color var(--transition), box-shadow var(--transition);
    }
    input:focus, select:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }
    input::placeholder { color: #9ca3af; }

    /* ---- Buttons ---- */
    button {
      border: none; border-radius: var(--radius-sm); padding: 8px 16px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all var(--transition); display: inline-flex; align-items: center;
      justify-content: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: var(--shadow); }
    .btn-secondary { background: #fff; color: #374151; border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
    .btn-secondary:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:active:not(:disabled) { transform: scale(.98); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    /* ---- Status Line ---- */
    .status-line { min-height: 20px; font-size: 13px; color: var(--muted); margin-top: 8px; }
    .status-line.error { color: var(--danger); }
    .status-line.success { color: var(--success); }

    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* ---- Filter Grid ---- */
    .filter-grid {
      display: grid;
      grid-template-columns: auto 1.35fr 0.9fr 0.9fr 0.9fr 0.9fr auto;
      gap: 10px;
      align-items: end;
    }
    .filter-grid .actions-col,
    .filter-grid .hint,
    .filter-grid .status-line {
      grid-column: 1 / -1;
    }
    .field { display: grid; gap: 4px; }
    .field.inline-field { gap: 4px; min-width: 0; }

    /* ---- Status Filter Tags ---- */
    .tag-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-option {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      user-select: none;
    }
    .tag-option.active {
      background: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary);
    }

    /* ---- Content Grid ---- */
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 14px;
      align-items: start;
    }

    /* ---- List Header ---- */
    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .list-head .card-title { margin: 0; }
    .count-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--line); background: #fff;
      font-size: 13px; font-weight: 700; color: var(--text);
    }

    /* ---- Project Rows ---- */
    .project-list { display: grid; gap: 10px; }

    .project-row {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      background: var(--card);
      display: grid;
      gap: 10px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .project-row:hover {
      border-color: var(--primary-border);
      box-shadow: var(--shadow-md);
    }
    .project-row.selected {
      border-color: var(--primary-border);
      background: var(--primary-light);
      box-shadow: var(--shadow-md);
    }

    .project-row-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .project-title { font-size: 15px; font-weight: 700; line-height: 1.3; }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    /* ---- Status Badges ---- */
    .status-badge {
      display: inline-flex; align-items: center;
      border-radius: 999px; padding: 3px 9px;
      font-size: 12px; font-weight: 700; white-space: nowrap;
      background: #f2f4f8; color: #6c778d;
    }
    .status-ongoing  { background: #e6fcf5; color: var(--success); }
    .status-upcoming { background: var(--primary-light); color: var(--primary); }
    .status-ended    { background: #f2f4f8; color: #6c778d; }

    .project-row-actions {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    }

    .select-btn {
      border: 1px solid var(--line); background: #fff; color: #374151;
      border-radius: 999px; padding: 4px 12px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: all var(--transition); white-space: nowrap;
    }
    .select-btn:hover { border-color: var(--primary-border); color: var(--primary); }
    .select-btn.active {
      background: var(--primary); border-color: var(--primary); color: #fff;
    }

    /* ---- Pill Row ---- */
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .value-pill {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 999px;
      background: var(--primary-light); border: 1px solid var(--primary-border);
      color: var(--primary); font-weight: 700; font-size: 13px;
    }
    .value-pill.empty {
      color: var(--muted); background: #f7f9fc; border-color: var(--line);
    }

    /* ---- Quick Edit Row ---- */
    .quick-edit-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .quick-edit-row select {
      min-width: 160px; max-width: 240px; height: 34px; width: auto;
      padding: 0 10px; font-size: 13px;
    }

    /* ---- Side Panel ---- */
    .side-panel { position: sticky; top: 18px; display: grid; gap: 14px; }

    /* ---- Summary Stats ---- */
    .summary-stats {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
      margin-top: 10px;
    }
    .summary-stat {
      border: 1px solid var(--line); border-radius: var(--radius); padding: 10px;
      background: #fafbfc; text-align: center;
    }
    .summary-stat-number { display: block; font-size: 22px; font-weight: 900; line-height: 1; }
    .summary-stat-label { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); font-weight: 700; }

    /* ---- Assign Panel ---- */
    .assign-panel { display: grid; gap: 12px; }

    /* ---- Check Grid (App Servers) ---- */
    .check-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 6px;
    }
    .check-card {
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 8px 10px; background: #fff;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none; font-size: 13px; font-weight: 600;
      transition: all var(--transition);
    }
    .check-card.active {
      background: var(--primary-light); border-color: var(--primary-border);
      color: var(--primary);
    }
    .check-card input { width: 16px; height: 16px; margin: 0; flex: none; width: auto; }

    /* ---- Empty State ---- */
    .empty-state {
      padding: 28px; text-align: center; color: var(--muted);
      border: 1px dashed var(--line); border-radius: var(--radius-lg);
      background: #fafbfc; font-size: 14px;
    }

    @media (max-width: 1240px) {
      .content-grid { grid-template-columns: 1fr; }
      .side-panel { position: static; }
      .filter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 980px) {
      .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .page { padding: 14px 16px 32px; }
      .filter-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div class="page-header-left">
        <h1>项目分配管理台</h1>
        <span class="subtitle">负责人和应用服务器分配</span>
      </div>
      <div class="page-header-right">
        <span class="auth-user" id="auth-chip">未登录</span>
        <button class="header-action-btn" id="open-main-btn" type="button">打开查询页</button>
        <button class="header-action-btn" id="logout-btn" type="button">退出登录</button>
      </div>
    </div>

    <div class="layout">
      <section class="card">
        <div class="card-title">筛选</div>
        <div class="filter-grid">
          <div class="field inline-field">
            <label>状态</label>
            <div class="tag-group">
              <span class="tag-option active" data-status="正在进行">正在进行</span>
              <span class="tag-option active" data-status="即将开始">即将开始</span>
              <span class="tag-option active" data-status="已结束">已结束</span>
            </div>
          </div>

          <div class="field">
            <label for="project-keyword">项目关键词</label>
            <input id="project-keyword" placeholder="按项目名称筛选">
          </div>

          <div class="field">
            <label for="server-keyword">数据库服务器</label>
            <input id="server-keyword" placeholder="如：162">
          </div>

          <div class="field">
            <label for="exam-keyword">考试代码</label>
            <input id="exam-keyword" placeholder="如：39">
          </div>

          <div class="field">
            <label for="maintainer-filter">负责人</label>
            <select id="maintainer-filter">
              <option value="">全部负责人</option>
            </select>
          </div>

          <div class="field">
            <label for="assignment-filter">分配状态</label>
            <select id="assignment-filter">
              <option value="all">全部项目</option>
              <option value="unassigned">仅未分配负责人</option>
              <option value="assigned">仅已分配负责人</option>
            </select>
          </div>

          <div class="actions-col actions">
            <button class="btn-primary" type="button" id="query-btn">查询项目</button>
            <button class="btn-secondary" type="button" id="reset-btn">重置条件</button>
          </div>
          <div class="hint">先点项目卡右上角"选择"，再到右侧批量保存；也可在每行直接修改负责人。</div>
          <div class="status-line" id="query-status"></div>
        </div>
      </section>

      <div class="content-grid">
        <div class="card">
          <div class="list-head">
            <div class="card-title">项目列表</div>
            <span class="count-chip"><span id="result-count">0</span> 个项目</span>
          </div>
          <div id="project-list" class="project-list"></div>
        </div>

        <aside class="side-panel">
          <div class="card">
            <div class="card-title">当前选中</div>
            <div class="summary-stats">
              <div class="summary-stat">
                <span class="summary-stat-number" id="selected-count">0</span>
                <span class="summary-stat-label">项目数</span>
              </div>
              <div class="summary-stat">
                <span class="summary-stat-number" id="selected-servers">0</span>
                <span class="summary-stat-label">数据库</span>
              </div>
              <div class="summary-stat">
                <span class="summary-stat-number" id="selected-apps">0</span>
                <span class="summary-stat-label">应用服务器</span>
              </div>
            </div>
          </div>

          <div class="card assign-panel">
            <div class="card-title">批量分配</div>
            <div class="field">
              <label for="batch-maintainer">负责人</label>
              <select id="batch-maintainer">
                <option value="">未指定</option>
              </select>
            </div>

            <div class="field">
              <label>应用服务器</label>
              <div id="batch-app-servers" class="check-grid"></div>
              <div class="hint" id="batch-app-hint">正在加载可选应用服务器...</div>
            </div>

            <div class="actions">
              <button class="btn-primary" type="button" id="save-batch-btn">保存选中项目</button>
              <button class="btn-secondary" type="button" id="clear-selection-btn">清空选中</button>
            </div>
            <div class="status-line" id="batch-status"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    const buildAppUrl = (path) => {
      const normalized = path.startsWith("/") ? path : `/${path}`;
      const basePath = window.location.pathname.replace(/\/[^/]*$/, "");
      return `${basePath}${normalized}`;
    };

    async function apiFetch(url, options = {}) {
      return fetch(url, {
        credentials: "include",
        headers: {
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        },
        ...options
      });
    }

    async function getJson(url, options = {}) {
      const response = await apiFetch(url, options);
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) {
        throw new Error(data?.detail || "请求失败");
      }
      return data;
    }

    async function postJson(url, body) {
      return getJson(url, { method: "POST", body: JSON.stringify(body) });
    }

    const state = {
      auth: null,
      users: [],
      metadata: [],
      metadataMap: new Map(),
      appServerOptions: [],
      projects: [],
      filteredProjects: [],
      selectedKeys: new Set()
    };

    function escapeHtml(value) {
      return (value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function getProjectKey(item) {
      return `${item.serverName}::${item.examCode}`;
    }

    function parseAppServers(raw) {
      return (raw || "")
        .split(/[、,，;；\r\n]+/)
        .map(item => item.trim())
        .filter(Boolean);
    }

    function setStatus(id, text, type = "") {
      const element = document.getElementById(id);
      element.textContent = text || "";
      element.className = `status-line${type ? ` ${type}` : ""}`;
    }

    function syncMetadataMap() {
      state.metadataMap = new Map(
        state.metadata.map(item => [`${item.serverName}::${item.examCode}`, item])
      );
    }

    function getSelectedStatuses() {
      return Array.from(document.querySelectorAll(".tag-option.active")).map(el => el.dataset.status);
    }

    function buildQueryRequest() {
      return {
        statusFilters: getSelectedStatuses(),
        timeMatchMode: "overlap",
        stageKeyword: "",
        stageNames: [],
        serverNames: [],
        projectKeyword: document.getElementById("project-keyword").value.trim(),
        serverKeyword: document.getElementById("server-keyword").value.trim(),
        databaseKeyword: "",
        examCodeKeyword: document.getElementById("exam-keyword").value.trim(),
        rangeStart: null,
        rangeEnd: null,
        dayOffsets: []
      };
    }

    function fillMaintainerSelects() {
      const filter = document.getElementById("maintainer-filter");
      const batch = document.getElementById("batch-maintainer");
      const options = ['<option value="">全部负责人</option>']
        .concat(state.users.map(user => `<option value="${escapeHtml(user.username)}">${escapeHtml(user.username)}（${escapeHtml(user.role)}）</option>`));
      filter.innerHTML = options.join("");
      batch.innerHTML = '<option value="">未指定</option>' +
        state.users.map(user => `<option value="${escapeHtml(user.username)}">${escapeHtml(user.username)}（${escapeHtml(user.role)}）</option>`).join("");
    }

    function renderAppServerOptions() {
      const container = document.getElementById("batch-app-servers");
      const hint = document.getElementById("batch-app-hint");
      if (!state.appServerOptions.length) {
        container.innerHTML = "";
        hint.textContent = "还没有可选应用服务器，请先在正式页面里维护应用服务器配置。";
        return;
      }

      hint.textContent = `共 ${state.appServerOptions.length} 个可选应用服务器。`;
      container.innerHTML = state.appServerOptions.map(item => {
        const value = escapeHtml(item.name);
        return `
          <label class="check-card" data-app-option="${value}">
            <input type="checkbox" value="${value}">
            <span>${value}</span>
          </label>`;
      }).join("");
    }

    function getProjectMaintainer(project) {
      return state.metadataMap.get(getProjectKey(project))?.maintainer || "";
    }

    function getProjectAppServers(project) {
      return parseAppServers(state.metadataMap.get(getProjectKey(project))?.appServers || "");
    }

    function applyProjectFilters() {
      const maintainerFilter = document.getElementById("maintainer-filter").value;
      const assignmentFilter = document.getElementById("assignment-filter").value;

      state.filteredProjects = state.projects.filter(project => {
        const maintainer = getProjectMaintainer(project);
        if (maintainerFilter && maintainer !== maintainerFilter) {
          return false;
        }

        if (assignmentFilter === "unassigned" && maintainer) {
          return false;
        }

        if (assignmentFilter === "assigned" && !maintainer) {
          return false;
        }

        return true;
      });
    }

    function renderProjectList() {
      applyProjectFilters();
      const container = document.getElementById("project-list");
      document.getElementById("result-count").textContent = String(state.filteredProjects.length);

      if (!state.filteredProjects.length) {
        container.innerHTML = '<div class="empty-state">没有符合条件的项目。</div>';
        renderSelectionSummary();
        return;
      }

      container.innerHTML = state.filteredProjects.map(project => {
        const key = getProjectKey(project);
        const maintainer = getProjectMaintainer(project);
        const appServers = getProjectAppServers(project);
        const statuses = Array.isArray(project.statuses) ? project.statuses : [];
        const status = statuses.includes("正在进行")
          ? "正在进行"
          : statuses.includes("即将开始")
            ? "即将开始"
            : "已结束";
        const statusClass = status === "正在进行"
          ? "status-ongoing"
          : status === "即将开始"
            ? "status-upcoming"
            : "status-ended";
        const selected = state.selectedKeys.has(key) ? " selected" : "";

        return `
          <article class="project-row${selected}" data-key="${escapeHtml(key)}">
            <div class="project-row-top">
              <div>
                <div class="project-title">${escapeHtml(project.projectName)}</div>
                <div class="project-meta">
                  <span>${escapeHtml(project.serverName)} / ${escapeHtml(project.databaseName)}</span>
                  <span>考试代码：${escapeHtml(project.examCode)}</span>
                </div>
              </div>
              <div class="project-row-actions">
                <button type="button" class="select-btn${state.selectedKeys.has(key) ? " active" : ""}" data-select-key="${escapeHtml(key)}">
                  ${state.selectedKeys.has(key) ? "已选" : "选择"}
                </button>
                <span class="status-badge ${statusClass}">${escapeHtml(status)}</span>
              </div>
            </div>
            <div class="pill-row">
              ${maintainer
                ? `<span class="value-pill">${escapeHtml(maintainer)}</span>`
                : '<span class="value-pill empty">未指定负责人</span>'}
              ${appServers.length
                ? appServers.map(item => `<span class="value-pill">${escapeHtml(item)}</span>`).join("")
                : '<span class="value-pill empty">未分配应用服务器</span>'}
            </div>
            <div class="quick-edit-row">
              <select data-maintainer-select="${escapeHtml(key)}">
                <option value="">未指定负责人</option>
                ${state.users.map(user => `
                  <option value="${escapeHtml(user.username)}" ${user.username === maintainer ? "selected" : ""}>
                    ${escapeHtml(user.username)}（${escapeHtml(user.role)}）
                  </option>`).join("")}
              </select>
              <button type="button" class="btn-primary btn-sm" data-save-maintainer="${escapeHtml(key)}">保存负责人</button>
            </div>
          </article>
        `;
      }).join("");

      renderSelectionSummary();
    }

    function renderSelectionSummary() {
      const selectedProjects = state.filteredProjects.filter(project => state.selectedKeys.has(getProjectKey(project)));
      document.getElementById("selected-count").textContent = String(selectedProjects.length);
      document.getElementById("selected-servers").textContent = String(new Set(selectedProjects.map(item => item.serverName)).size);
      document.getElementById("selected-apps").textContent = String(new Set(selectedProjects.flatMap(item => getProjectAppServers(item))).size);
    }

    async function ensureAuth() {
      const auth = await getJson(buildAppUrl("/api/auth/status"));
      state.auth = auth;
      document.getElementById("auth-chip").textContent = auth.authenticated
        ? `${auth.username} / ${auth.role}`
        : "未登录";

      if (!auth.authenticated) {
        window.location.href = buildAppUrl("/");
        return false;
      }

      if (!(auth.role === "admin" || auth.role === "internal")) {
        document.body.innerHTML = '<div class="page"><h1 style="margin-top:40px">无权访问</h1><p style="color:var(--muted);margin-top:8px">本地管理页仅开放给管理员和内部用户。</p></div>';
        return false;
      }

      return true;
    }

    async function loadBaseData() {
      const [users, metadata, appServers] = await Promise.all([
        getJson(buildAppUrl("/api/auth/users")),
        getJson(buildAppUrl("/api/project-metadata")),
        getJson(buildAppUrl("/api/app-server-options"))
      ]);

      state.users = users;
      state.metadata = metadata;
      state.appServerOptions = appServers;
      syncMetadataMap();
      fillMaintainerSelects();
      renderAppServerOptions();
    }

    async function queryProjects() {
      setStatus("query-status", "正在查询项目...");
      try {
        const summary = await postJson(buildAppUrl("/api/query"), buildQueryRequest());
        state.projects = Array.isArray(summary.groups) ? summary.groups : [];
        renderProjectList();
        setStatus("query-status", `查询完成，共 ${state.projects.length} 个项目。`, "success");
      } catch (error) {
        state.projects = [];
        renderProjectList();
        setStatus("query-status", error.message || "查询失败", "error");
      }
    }

    function getSelectedAppServers() {
      return Array.from(document.querySelectorAll('#batch-app-servers input[type="checkbox"]:checked')).map(input => input.value);
    }

    async function saveBatch() {
      const selectedProjects = state.filteredProjects.filter(project => state.selectedKeys.has(getProjectKey(project)));
      if (!selectedProjects.length) {
        setStatus("batch-status", "请先选择至少一个项目。", "error");
        return;
      }

      const maintainer = document.getElementById("batch-maintainer").value;
      const appServers = getSelectedAppServers().join("、");

      setStatus("batch-status", `正在保存 ${selectedProjects.length} 个项目...`);
      try {
        for (const project of selectedProjects) {
          await postJson(buildAppUrl("/api/project-metadata"), {
            serverName: project.serverName,
            examCode: project.examCode,
            maintainer,
            appServers
          });
        }

        state.metadata = await getJson(buildAppUrl("/api/project-metadata"));
        syncMetadataMap();
        renderProjectList();
        setStatus("batch-status", `已保存 ${selectedProjects.length} 个项目。`, "success");
      } catch (error) {
        setStatus("batch-status", error.message || "保存失败", "error");
      }
    }

    document.querySelectorAll(".tag-option").forEach(el => {
      el.addEventListener("click", () => {
        el.classList.toggle("active");
      });
    });

    document.getElementById("query-btn").addEventListener("click", queryProjects);
    document.getElementById("reset-btn").addEventListener("click", () => {
      document.getElementById("project-keyword").value = "";
      document.getElementById("server-keyword").value = "";
      document.getElementById("exam-keyword").value = "";
      document.getElementById("maintainer-filter").value = "";
      document.getElementById("assignment-filter").value = "all";
      document.querySelectorAll(".tag-option").forEach(el => el.classList.add("active"));
      renderProjectList();
      setStatus("query-status", "");
    });

    document.getElementById("maintainer-filter").addEventListener("change", renderProjectList);
    document.getElementById("assignment-filter").addEventListener("change", renderProjectList);

    document.getElementById("project-list").addEventListener("click", (event) => {
      const selectButton = event.target.closest("[data-select-key]");
      if (selectButton) {
        event.stopPropagation();
        const key = selectButton.dataset.selectKey;
        if (state.selectedKeys.has(key)) {
          state.selectedKeys.delete(key);
        } else {
          state.selectedKeys.add(key);
        }
        renderProjectList();
        return;
      }

      const saveMaintainerButton = event.target.closest("[data-save-maintainer]");
      if (saveMaintainerButton) {
        event.stopPropagation();
        return;
      }

      const interactive = event.target.closest("select, input, textarea, button, a, label");
      if (interactive) {
        return;
      }

      const row = event.target.closest(".project-row");
      if (!row) return;
      const key = row.dataset.key;
      if (state.selectedKeys.has(key)) {
        state.selectedKeys.delete(key);
      } else {
        state.selectedKeys.add(key);
      }
      renderProjectList();
    });

    document.getElementById("project-list").addEventListener("change", async (event) => {
      const select = event.target.closest("[data-maintainer-select]");
      if (!select) return;
      select.dataset.dirty = "true";
    });

    document.getElementById("project-list").addEventListener("click", async (event) => {
      const saveButton = event.target.closest("[data-save-maintainer]");
      if (!saveButton) return;

      event.stopPropagation();
      const key = saveButton.dataset.saveMaintainer;
      const select = document.querySelector(`[data-maintainer-select="${CSS.escape(key)}"]`);
      if (!select) return;

      const project = state.filteredProjects.find(item => getProjectKey(item) === key);
      if (!project) return;

      setStatus("batch-status", `正在保存 ${project.projectName} 的负责人...`);
      try {
        const existing = state.metadataMap.get(key);
        await postJson(buildAppUrl("/api/project-metadata"), {
          serverName: project.serverName,
          examCode: project.examCode,
          maintainer: select.value,
          appServers: existing?.appServers || ""
        });

        state.metadata = await getJson(buildAppUrl("/api/project-metadata"));
        syncMetadataMap();
        renderProjectList();
        setStatus("batch-status", `${project.projectName} 的负责人已更新。`, "success");
      } catch (error) {
        setStatus("batch-status", error.message || "保存负责人失败", "error");
      }
    });

    document.getElementById("batch-app-servers").addEventListener("change", (event) => {
      const card = event.target.closest(".check-card");
      if (!card) return;
      card.classList.toggle("active", event.target.checked);
    });

    document.getElementById("clear-selection-btn").addEventListener("click", () => {
      state.selectedKeys.clear();
      renderProjectList();
      setStatus("batch-status", "已清空选中项目。");
    });

    document.getElementById("save-batch-btn").addEventListener("click", saveBatch);

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await postJson(buildAppUrl("/api/auth/logout"), {});
      window.location.href = buildAppUrl("/");
    });

    document.getElementById("open-main-btn").addEventListener("click", () => {
      window.location.href = buildAppUrl("/");
    });

    (async function bootstrap() {
      const allowed = await ensureAuth();
      if (!allowed) return;
      await loadBaseData();
      await queryProjects();
    })();
  </script>
</body>
</html>
